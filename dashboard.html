<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Dashboard | IronX</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="footer.css"><style>
body{background:var(--ink);color:var(--paper)}.dash{max-width:1200px;margin:auto;padding:70px 40px 110px}.dash-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:35px;margin-bottom:45px}.dash-head>div{min-width:0}.dash h1{max-width:820px;font:900 clamp(58px,8vw,112px)/.88 var(--display);letter-spacing:-.02em;margin:0;text-transform:uppercase;overflow-wrap:normal}.dash h1 i{color:var(--lime);font-style:normal}.dash-head p{color:var(--muted);max-width:280px;line-height:1.5}.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.dash-panel{background:#252820;padding:32px}.dash-panel h2{margin:0 0 25px;font-size:32px}.profile-form{display:grid;gap:16px}.profile-form label{display:grid;gap:7px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.profile-form input{padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);color:var(--paper);font:15px var(--body)}.profile-form input:focus{outline:0;border-color:var(--lime)}.dash-message{color:var(--lime);font-size:13px;min-height:20px}.order-list{display:grid;gap:12px}.order{border-bottom:1px solid var(--line);padding:0 0 14px;display:flex;justify-content:space-between;gap:15px}.order small{display:block;color:var(--muted);margin-top:5px}.order b{color:var(--lime);font-size:12px}.dash-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}.dash-actions a,.dash-actions button{cursor:pointer}.empty{color:var(--muted);line-height:1.5}@media(max-width:760px){.dash{padding:50px 22px 80px}.dash-head{display:block}.dash-head p{margin-top:25px}.dash h1{max-width:100%;font-size:clamp(56px,16vw,92px);line-height:.9}.dash-grid{grid-template-columns:1fr}.dash-panel{padding:24px}}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><span>IRON</span><b>X</b></a><button class="nav-cta" id="logout" type="button">Log out <span>↗</span></button></header><main class="dash"><div class="dash-head"><div><p class="eyebrow"><span class="eyebrow-line"></span> Member dashboard</p><h1>KEEP<br><i>SHOWING UP.</i></h1></div><p>Your home base for profile details, session requests, and Iron X products.</p></div><div class="dash-grid"><section class="dash-panel"><h2>Your profile</h2><form class="profile-form" id="profile-form"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone"></label><button class="button button-primary" type="submit">Save profile <span>↗</span></button><p class="dash-message" id="profile-message"></p></form><div class="dash-actions"><a class="text-link" href="booking.html">Book a free session ↗</a></div></section><section class="dash-panel"><h2>Your requests</h2><div class="order-list" id="orders"></div><div class="dash-actions"><a class="text-link" href="nutrition.html">Shop nutrition ↗</a><a class="text-link" href="store.html">Shop store ↗</a></div></section></div></main><script>
const profile=document.querySelector('#profile-form');const message=document.querySelector('#profile-message');const orders=document.querySelector('#orders');const grid=document.querySelector('.dash-grid');
const cartPanel=document.createElement('section');cartPanel.className='dash-panel';cartPanel.innerHTML='<h2>Your cart</h2><div id="cart-list"></div><p id="cart-total" style="color:var(--lime);font-weight:700"></p><button class="button button-primary" id="checkout" type="button">Place order <span>↗</span></button><p class="dash-message" id="order-message"></p><div class="dash-actions"><a class="text-link" href="nutrition.html">Shop nutrition ↗</a><a class="text-link" href="store.html">Shop store ↗</a></div>';grid.appendChild(cartPanel);
function readCart(){try{return JSON.parse(localStorage.getItem('ironx_cart')||'[]')}catch{return[]}}function writeCart(cart){localStorage.setItem('ironx_cart',JSON.stringify(cart))}function renderCart(){const cart=readCart();const list=document.querySelector('#cart-list');list.innerHTML=cart.length?cart.map((item,index)=>`<div class="order"><div><strong>${item.product}</strong><small>${item.category} · ₹${item.price.toLocaleString()}</small></div><span><button type="button" data-cart="minus" data-index="${index}">−</button> ${item.quantity} <button type="button" data-cart="plus" data-index="${index}">+</button> <button type="button" data-cart="remove" data-index="${index}">×</button></span></div>`).join(''):'<p class="empty">Your cart is empty.</p>';document.querySelector('#cart-total').textContent=`Total ₹${cart.reduce((total,item)=>total+item.price*item.quantity,0).toLocaleString()}`}renderCart();cartPanel.addEventListener('click',event=>{const button=event.target.closest('[data-cart]');if(!button)return;const cart=readCart();const index=Number(button.dataset.index);if(button.dataset.cart==='plus')cart[index].quantity+=1;if(button.dataset.cart==='minus')cart[index].quantity=Math.max(0,cart[index].quantity-1);if(button.dataset.cart==='remove'||cart[index].quantity===0)cart.splice(index,1);writeCart(cart);renderCart()});
(async()=>{const response=await fetch('/api/me');if(!response.ok){location.href='auth.html';return}const data=await response.json();if(!data.user){location.href='auth.html';return}for(const field of ['name','email','phone'])profile.elements[field].value=data.user[field]||'';orders.innerHTML=data.orders.length?data.orders.map(order=>`<div class="order"><div><strong>${order.product_name}</strong><small>${order.category} · Qty ${order.quantity} · ${order.order_ref}</small></div><b>${order.status}</b></div>`).join(''):'<p class="empty">No orders yet.</p>';})();
profile.addEventListener('submit',async event=>{event.preventDefault();const response=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(profile)))});const data=await response.json();message.textContent=response.ok?'Profile saved.':data.error;});document.querySelector('#checkout').addEventListener('click',async()=>{const cart=readCart();const orderMessage=document.querySelector('#order-message');if(!cart.length){orderMessage.textContent='Add a product before placing an order.';return}const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart})});const data=await response.json();if(!response.ok){orderMessage.textContent=data.error||'Order could not be created.';return}localStorage.removeItem('ironx_cart');orderMessage.textContent='Order created successfully. You are still logged in.';renderCart();setTimeout(()=>location.reload(),500)});document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location.href='index.html';});
</script></body></html>
