<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Access | IronX Gym</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="footer.css">
  <style>
    body{background:radial-gradient(circle at 78% 12%,rgba(215,243,74,.08),transparent 26%),var(--ink);color:var(--paper)}
    .access{min-height:calc(100vh - 88px);max-width:1180px;margin:auto;padding:72px 40px 100px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(390px,.8fr);gap:clamp(55px,9vw,125px);align-items:center}
    .access-copy{animation:access-rise .65s ease both}.access-copy .eyebrow{margin-bottom:28px}.access h1{font:900 clamp(76px,10vw,142px)/.78 var(--display);margin:0 0 34px;letter-spacing:-.025em;text-transform:uppercase}.access h1 i{color:var(--lime);font-style:normal}.access-copy p:last-child{max-width:390px;color:var(--muted);line-height:1.7;margin:0}
    .access-card{background:rgba(26,29,24,.88);border:1px solid rgba(231,232,223,.12);box-shadow:0 24px 70px rgba(0,0,0,.26);padding:34px 36px 30px;border-radius:4px;animation:access-rise .65s .1s ease both}.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:28px}.tabs button{position:relative;border:0;background:none;color:var(--muted);padding:0 0 15px;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.tabs button:after{content:"";position:absolute;right:0;bottom:-1px;left:0;height:2px;background:var(--lime);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}.tabs button.active{color:var(--lime)}.tabs button.active:after{transform:scaleX(1)}.tabs button:focus-visible,.access-form input:focus-visible,.password-toggle:focus-visible,.admin-link:focus-visible,.switch-link:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
    .access-form{display:grid;gap:20px;animation:form-in .25s ease both}.access-form[hidden]{display:none}.access-form label{display:grid;gap:7px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.field-control{display:flex;align-items:center;border-bottom:1px solid var(--line)}.access-form input{width:100%;min-width:0;padding:10px 0;background:none;border:0;color:var(--paper);font:15px var(--body)}.access-form input::placeholder{color:#6f746b}.access-form input:focus{outline:0}.field-control:focus-within{border-color:var(--lime);box-shadow:0 1px 0 var(--lime)}.password-toggle{border:0;background:none;color:var(--muted);padding:6px 0 6px 10px;font:700 10px var(--body);text-transform:uppercase;letter-spacing:.08em;cursor:pointer}.password-toggle:hover{color:var(--lime)}.access-form .button{width:100%;min-height:48px;justify-content:space-between;margin-top:2px}.access-form .button:hover{filter:brightness(1.08);transform:translateY(-1px)}.form-meta{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:-7px}.form-meta a,.admin-link,.switch-link{color:var(--muted);font-size:11px;text-decoration:none}.form-meta a:hover,.admin-link:hover,.switch-link:hover{color:var(--lime)}.access-message{min-height:22px;margin:17px 0 0;color:var(--lime);font-size:12px}.access-message.error{color:#ff9477}.admin-link{display:inline-block;margin-top:11px}.switch-link{display:block;text-align:center;margin-top:-5px}
    @keyframes access-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes form-in{from{opacity:0;transform:translateX(5px)}to{opacity:1;transform:translateX(0)}}
    @media(max-width:820px){.access{min-height:auto;padding:58px 30px 85px;grid-template-columns:minmax(0,1fr) minmax(340px,.9fr);gap:45px}.access h1{font-size:clamp(72px,11vw,112px)}}
    @media(max-width:680px){.access{display:block;padding:42px 22px 75px}.access h1{font-size:clamp(75px,23vw,115px);margin-bottom:27px}.access-copy p:last-child{font-size:14px}.access-card{margin-top:48px;padding:27px 22px 25px}.tabs{gap:22px}}
    @media(max-width:360px){.tabs{gap:15px}.tabs button{font-size:11px}.access-card{padding-right:18px;padding-left:18px}}
  </style>
</head>
<body><header class="site-header"><a class="brand" href="index.html"><span>IRON</span><b>X</b></a><a class="nav-cta" href="index.html">Back home <span>↗</span></a></header>
<main class="access"><section class="access-copy"><p class="eyebrow"><span class="eyebrow-line"></span> Iron X member access</p><h1>YOUR<br><i>IRON LIFE.</i></h1><p>Sign in to manage your membership, track your workouts, book training sessions, and explore the Iron X store.</p></section><section class="access-card" aria-label="Member authentication"><div class="tabs" role="tablist" aria-label="Authentication options"><button class="active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login" data-panel="login">Log in</button><button id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register" data-panel="register">Create account</button></div><form class="access-form" id="login" role="tabpanel" aria-labelledby="login-tab"><label for="login-email">Email</label><div class="field-control"><input id="login-email" name="email" type="email" placeholder="you@email.com" autocomplete="email" required></div><label for="login-password">Password</label><div class="field-control"><input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password="login-password" aria-label="Show password">Show</button></div><button class="button button-primary" type="submit">Log in <span>↗</span></button><div class="form-meta"><a href="mailto:hello@ironxgym.com?subject=IronX%20password%20help">Forgot password?</a><a class="admin-link" href="admin.html">Admin portal access ↗</a></div></form><form class="access-form" id="register" role="tabpanel" aria-labelledby="register-tab" hidden><label for="register-name">Name</label><div class="field-control"><input id="register-name" name="name" type="text" placeholder="Alex Morgan" autocomplete="name" required></div><label for="register-email">Email</label><div class="field-control"><input id="register-email" name="email" type="email" placeholder="you@email.com" autocomplete="email" required></div><label for="register-phone">Phone</label><div class="field-control"><input id="register-phone" name="phone" type="tel" placeholder="+91 555 000 0000" autocomplete="tel"></div><label for="register-password">Password</label><div class="field-control"><input id="register-password" name="password" type="password" placeholder="8 characters minimum" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-password="register-password" aria-label="Show password">Show</button></div><button class="button button-primary" type="submit">Create account <span>↗</span></button><a class="switch-link" href="#login" data-switch="login">Already have an account? Log in</a></form><p class="access-message" role="status" aria-live="polite"></p></section></main>
<script>
const tabs=document.querySelectorAll('.tabs button');const forms={login:document.querySelector('#login'),register:document.querySelector('#register')};const message=document.querySelector('.access-message');
function selectPanel(panel){tabs.forEach(tab=>{const selected=tab.dataset.panel===panel;tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected));});Object.entries(forms).forEach(([key,form])=>{form.hidden=key!==panel;});message.textContent='';message.className='access-message';}
tabs.forEach(tab=>tab.addEventListener('click',()=>selectPanel(tab.dataset.panel)));document.querySelector('[data-switch="login"]').addEventListener('click',event=>{event.preventDefault();selectPanel('login');document.querySelector('#login-email').focus();});
document.querySelectorAll('.password-toggle').forEach(toggle=>toggle.addEventListener('click',()=>{const input=document.querySelector(`#${toggle.dataset.password}`);const visible=input.type==='text';input.type=visible?'password':'text';toggle.textContent=visible?'Show':'Hide';toggle.setAttribute('aria-label',visible?'Show password':'Hide password');}));
Object.entries(forms).forEach(([mode,form])=>form.addEventListener('submit',async event=>{event.preventDefault();message.className='access-message';message.textContent='Working...';try{const response=await fetch(`/api/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const result=await response.json();if(!response.ok)throw new Error(result.error);window.location.href=new URLSearchParams(location.search).get('next')||'dashboard.html';}catch(error){message.classList.add('error');message.textContent=error.message;}}));
</script></body></html>
